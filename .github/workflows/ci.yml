name: CI

# The full matrix, on every pull request and every push to main: the batteries
# Scripts/ci_batteries.py defines, the push gates Scripts/pre-push-gates.sh runs
# (the same families, through the same runner, with every diff-chosen gate
# selected and every stand-down a failure). Core owns the engine, host,
# sanitizers, portable snapshots and WASM oracle. Kit and app CI build their
# own products with the library commits they pin.
#
# One required check, `CI`, needs every other job, so the list of jobs can
# change without a change to the repository's branch protection.
#
# A newer push to a pull request supersedes its run. main is exempt: every merge
# there is a commit that nothing else will re-verify, and a cancelled run would
# leave it without a verdict, which is what bisecting a regression across three
# repositories needs. Scheduled sweeps have a group of their own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'sweep' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  workflow_dispatch:
    inputs:
      ui_scenarios:
        description: "Also run the app's macOS UI scenarios in the app job"
        type: boolean
        default: false
  # Once a day: a sweep stands down when main's tip already has a verdict.
  schedule:
    - cron: "43 5 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

# GitHub-hosted runners only. Repository settings must keep self-hosted runners
# unregistered: a pull request can supply its own workflow file.
env:
  UBQ_CI_ANNOTATE: "1"

# Every job reads the checkout and nothing else. Preflight adds the two reads
# ci_reach.py needs, and the jobs that build another repository add none: the
# Kit and the app are public, and the pairing is read through the same token.
permissions:
  contents: read

jobs:
  preflight:
    # Draft events still enter workflow concurrency to cancel prior ready runs.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: CI preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      builds: ${{ steps.reach.outputs.builds }}
      linux: ${{ steps.reach.outputs.linux }}
      apple: ${{ steps.reach.outputs.apple }}
      cmake: ${{ steps.reach.outputs.cmake }}
      code: ${{ steps.reach.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Determine change reach and completed checkpoints
        id: reach
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 Scripts/ci_reach.py
      - name: Documentation-only change; platform coverage deferred
        if: steps.reach.outputs.documentation == 'true'
        run: echo "Documentation preflight runs; platform batteries remain outside this push."
      # A sweep that stands down runs no gate, so it concludes as the run that
      # judged this tip did: a failed tip stays red, and the next sweep reads
      # this run's failure as the same verdict rather than its skips as a pass.
      - name: Keep this tip's failed verdict
        if: steps.reach.outputs.standing == 'failure'
        run: |
          echo "::error title=CI reach::An earlier run of this commit failed a gate; this sweep did not run it again"
          exit 1
      # A hosted runner starts with no images, and this one takes minutes to
      # build. It is kept in the Actions cache under its recipe's digest, so a
      # run builds it only when the recipe changed.
      - name: Name the CI image
        id: image
        if: runner.environment == 'github-hosted' && steps.reach.outputs.preflight != 'false'
        run: echo "digest=$(./Scripts/ci-linux-image.sh --recipe-digest)" >> "$GITHUB_OUTPUT"
      - name: Restore the CI image
        id: restore-image
        if: steps.image.outputs.digest != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ runner.temp }}/ubq-ci-linux-image.tar
          key: ci-linux-image-${{ runner.arch }}-${{ steps.image.outputs.digest }}
      - name: Run the fail-fast preflight
        if: steps.reach.outputs.preflight != 'false'
        env:
          UBQ_CI_IMAGE_ARCHIVE: ${{ runner.temp }}/ubq-ci-linux-image.tar
          UBQ_CI_LINUX_IMAGE: ${{ runner.environment == 'github-hosted' }}
        run: ./Scripts/ci-linux-image.sh python3 Scripts/ci_batteries.py run preflight
      # The commit rules the push hook runs and the preflight battery does not,
      # through the hook's own runner. Strict: a gate that stands down fails.
      # The profile-orphan rule reads the Linux profile, which the image's
      # default LLVM is too old to read; UBQ_PGO_LLVM names the LLVM that wrote
      # it, as the battery's pgo stage puts it first on PATH.
      - name: Push gates (commit rules)
        if: steps.reach.outputs.preflight != 'false'
        env:
          UBQ_CI_LINUX_IMAGE: ${{ runner.environment == 'github-hosted' }}
          UBIQUITTY_PREPUSH: families
          UBQ_PREPUSH_FAMILIES: core_gate_commit_rules
          UBQ_PREPUSH_SELECT: all
          UBQ_PREPUSH_STRICT: "1"
          UBIQUITTY_PREPUSH_CACHE: "off"
        run: |
          ./Scripts/ci-linux-image.sh bash -c '
            export PATH="${UBQ_PGO_LLVM:+$UBQ_PGO_LLVM:}$PATH"
            exec ./Scripts/pre-push-gates.sh'
      # Saved whether or not a gate failed: the image was built either way.
      - name: Save the CI image
        if: always() && steps.image.outputs.digest != '' && steps.restore-image.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ runner.temp }}/ubq-ci-linux-image.tar
          key: ci-linux-image-${{ runner.arch }}-${{ steps.image.outputs.digest }}
      - name: Report completed, failed, and unexecuted preflight stages
        if: always() && steps.reach.outputs.preflight != 'false'
        run: python3 Scripts/ci_batteries.py report preflight
      # A failed stage's log, in full, in the job log. CI uploads no artifacts: the
      # job log is where a failure is read.
      - name: Print the failed stage logs
        if: failure()
        run: |
          for log in "$RUNNER_TEMP/ubiquitty-ci/preflight"/*.log; do
            [ -f "$log" ] || continue
            echo "::group::${log##*/}"
            cat "$log"
            echo "::endgroup::"
          done

  linux:
    # Four groups of the Linux battery on four runners, so the battery's wall
    # time is its longest group rather than their sum. ci_reach.py reads the
    # battery as complete only when every group is.
    name: Linux battery (${{ matrix.group }})
    needs: preflight
    if: needs.preflight.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      # A failure in one group does not stop the others: the author reads every
      # group's verdict from one push.
      fail-fast: false
      matrix:
        include:
          - group: gcc
            stages: --only setup --only quic --only host-tests --only portable-build --only portable-snapshots --only host-glibc --only agent-smokes --only host-musl
            families: ""
          # The Linux pgo stage is not hosted (Stage.hosted): its profile is
          # stamped with the image it was trained in, which this runner never
          # has.
          - group: clang
            stages: --only setup --only quic --only fuzz --only sanitizers
            families: ""
          # The host, ubq and the test tree built with Clang, then every tree
          # checked to have compiled with UBIQUITTY_OWNERSHIP_ANALYSIS on; a
          # group of its own keeps that build off the sanitizer build's runner.
          - group: analysis
            stages: --only setup --only quic
            families: core_gate_ownership
          - group: wasm
            stages: --only setup --only wasm-tools --only wasm-smoke
            families: core_gate_wasm
    env:
      UBQ_CI_CODE: ${{ needs.preflight.outputs.code }}
      UBQ_CI_CMAKE: ${{ needs.preflight.outputs.cmake }}
      UBQ_CI_PREFLIGHT_COMPLETE: "1"
      STAGES: ${{ matrix.stages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The Docker image, compiler cache, and test executables share the
      # hosted runner's disk. These preinstalled SDKs are not dependencies of
      # any battery; free their space before restoring the build caches.
      - name: Free unused hosted SDK space
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
          df -h /
      - name: Cache QUIC dependencies
        if: needs.preflight.outputs.code == 'true' && matrix.group != 'wasm'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: |
            ${{ runner.workspace }}/build-gcc/quic-deps/lib
            ${{ runner.workspace }}/build-gcc/quic-deps/include
          key: quic-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Scripts/fetch-quic-deps.sh') }}
      # One compiler cache per group: the groups compile with different
      # compilers and flags, and a shared one would evict across them. The
      # image's CCACHE_MAXSIZE bounds each to 2G.
      - name: Restore the compiler cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ runner.workspace }}/ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-linux-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-linux-${{ matrix.group }}-
            ccache-linux-${{ matrix.group }}-
      - name: Compiler cache statistics
        run: echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log" >> "$GITHUB_ENV"
      - name: Name the CI image
        id: image
        if: runner.environment == 'github-hosted'
        run: echo "digest=$(./Scripts/ci-linux-image.sh --recipe-digest)" >> "$GITHUB_OUTPUT"
      - name: Restore the CI image
        id: restore-image
        if: steps.image.outputs.digest != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ runner.temp }}/ubq-ci-linux-image.tar
          key: ci-linux-image-${{ runner.arch }}-${{ steps.image.outputs.digest }}
      - name: Run the fail-fast Linux battery
        id: battery
        env:
          UBQ_CI_IMAGE_ARCHIVE: ${{ runner.temp }}/ubq-ci-linux-image.tar
          UBQ_CI_LINUX_IMAGE: ${{ runner.environment == 'github-hosted' }}
        run: |
          # STAGES is this group's list of `--only <stage>` words, split on purpose.
          # shellcheck disable=SC2086
          ./Scripts/ci-linux-image.sh python3 Scripts/ci_batteries.py run linux $STAGES
      # The hook's families that only this group's toolchain runs: the wasm arm
      # and its oracle with the emscripten the battery installed, and the
      # ownership analyses with the image's clang.
      - name: Push gates (${{ matrix.group }})
        if: matrix.families != ''
        env:
          UBQ_CI_IMAGE_ARCHIVE: ${{ runner.temp }}/ubq-ci-linux-image.tar
          UBQ_CI_LINUX_IMAGE: ${{ runner.environment == 'github-hosted' }}
          UBIQUITTY_PREPUSH: families
          UBQ_PREPUSH_FAMILIES: ${{ matrix.families }}
          UBQ_PREPUSH_SELECT: all
          UBQ_PREPUSH_STRICT: "1"
          UBIQUITTY_PREPUSH_CACHE: "off"
          UBQ_BUILD_ROOT: ${{ runner.workspace }}/build-gates
          UBIQUITTY_QUIC_PREFIX: ${{ runner.workspace }}/build-gcc/quic-deps
          CC: clang
          CXX: clang++
        run: |
          ./Scripts/ci-linux-image.sh bash -c '
            emsdk="$RUNNER_TOOL_CACHE/emsdk-6.0.9/emsdk_env.sh"
            if [ -f "$emsdk" ]; then . "$emsdk" >/dev/null; fi
            exec ./Scripts/pre-push-gates.sh'
      - name: Save the CI image
        if: always() && steps.image.outputs.digest != '' && steps.restore-image.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ runner.temp }}/ubq-ci-linux-image.tar
          key: ci-linux-image-${{ runner.arch }}-${{ steps.image.outputs.digest }}
      # The history reader requires every group's marker. A goldens-only
      # battery, or a failed/cancelled partial run, is not a full checkpoint.
      - name: Full Linux battery completed
        if: steps.battery.outputs.full_code == 'true'
        run: echo "Every enabled Linux code stage of this group reached its verdict"
      - name: Report completed, failed, and unexecuted Linux stages
        if: always()
        run: |
          # shellcheck disable=SC2086
          python3 Scripts/ci_batteries.py report linux $STAGES
      - name: Print the failed stage logs
        if: failure()
        run: |
          for log in "$RUNNER_TEMP/ubiquitty-ci/linux"/*.log; do
            [ -f "$log" ] || continue
            echo "::group::${log##*/}"
            cat "$log"
            echo "::endgroup::"
          done
      - name: Compiler cache hit rate
        if: always()
        env:
          UBQ_CI_LINUX_IMAGE: "true"
        run: ./Scripts/ci-linux-image.sh bash -c 'if [ -s "$CCACHE_STATSLOG" ]; then ccache --show-log-stats; else echo "No compiler invocations recorded in this job"; fi'
      - name: Save the compiler cache
        if: always() && runner.environment == 'github-hosted'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ runner.workspace }}/ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-linux-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}

  apple:
    name: Apple battery
    needs: preflight
    if: needs.preflight.outputs.apple == 'true'
    # GitHub's image with the Xcode this tree builds with (27.1, as the
    # maintainers' Macs have it); see .github/actionlint.yml.
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      UBQ_CI_CODE: ${{ needs.preflight.outputs.code }}
      UBQ_CI_CMAKE: ${{ needs.preflight.outputs.cmake }}
      UBQ_CI_PREFLIGHT_COMPLETE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Selected Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      # A job's env cannot read the runner context, so this step sets the cache
      # beside the checkout and the build root's quic-deps from the runner's own
      # variables; every later step reads them.
      - name: Compiler cache and build root
        id: roots
        run: |
          command -v ccache >/dev/null 2>&1 || brew install ccache
          {
            echo "CCACHE_DIR=$RUNNER_WORKSPACE/ccache"
            echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log"
            echo "CCACHE_MAXSIZE=2G"
          } >> "$GITHUB_ENV"
          echo "build=$(python3 Scripts/build_root.py .)" >> "$GITHUB_OUTPUT"
          echo "quic_toolchain=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore QUIC dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: |
            ${{ steps.roots.outputs.build }}/quic-deps
            !${{ steps.roots.outputs.build }}/quic-deps/**/src/*/build
          key: quic-apple-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.roots.outputs.quic_toolchain }}-${{ hashFiles('Scripts/fetch-quic-deps.sh', 'Scripts/macos-deployment-target.txt', 'Scripts/cmake/UbiquittyPreProject.cmake') }}-apple-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: quic-apple-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.roots.outputs.quic_toolchain }}-${{ hashFiles('Scripts/fetch-quic-deps.sh', 'Scripts/macos-deployment-target.txt', 'Scripts/cmake/UbiquittyPreProject.cmake') }}-apple-
      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ runner.workspace }}/ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-apple-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-apple-
            ccache-apple-
      - name: Run the fail-fast Apple battery
        id: battery
        run: python3 Scripts/ci_batteries.py run apple
      # What the push hook runs on a Mac and the battery does not: the host
      # and ubq builds, then the proof that every tree this job built (the
      # battery's included) compiled with Apple Clang's ownership analyses on;
      # the PGO bounds against the portable profile, the symbol-fork check over
      # what was built, the benchmarks, and the style checks whose self-tests
      # read the built test objects. The whole suite ran above, so the subset
      # the hook selects by diff is not run again.
      - name: Push gates (macOS)
        env:
          UBIQUITTY_PREPUSH: families
          UBQ_PREPUSH_FAMILIES: core_gate_ownership core_gate_test_hygiene core_gate_forks core_gate_pgo_drift core_gate_style_checks core_gate_bench_compiles
          UBQ_PREPUSH_SELECT: all
          UBQ_PREPUSH_STRICT: "1"
          UBIQUITTY_PREPUSH_CACHE: "off"
        run: ./Scripts/pre-push-gates.sh
      - name: Full Apple battery completed
        if: steps.battery.outputs.full_code == 'true'
        run: echo "Every enabled Apple code stage reached its verdict"
      - name: Report completed, failed, and unexecuted Apple stages
        if: always()
        run: python3 Scripts/ci_batteries.py report apple
      - name: Print the failed stage logs
        if: failure()
        run: |
          for log in "$RUNNER_TEMP/ubiquitty-ci/apple"/*.log; do
            [ -f "$log" ] || continue
            echo "::group::${log##*/}"
            cat "$log"
            echo "::endgroup::"
          done
      - name: Compiler cache hit rate
        if: always()
        run: |
          if [ -s "$CCACHE_STATSLOG" ]; then ccache --show-log-stats; else echo "No compiler invocations recorded in this job"; fi
      - name: Save QUIC dependencies
        if: always() && steps.roots.outputs.build != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: |
            ${{ steps.roots.outputs.build }}/quic-deps
            !${{ steps.roots.outputs.build }}/quic-deps/**/src/*/build
          key: quic-apple-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.roots.outputs.quic_toolchain }}-${{ hashFiles('Scripts/fetch-quic-deps.sh', 'Scripts/macos-deployment-target.txt', 'Scripts/cmake/UbiquittyPreProject.cmake') }}-apple-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save the compiler cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ runner.workspace }}/ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-apple-${{ github.run_id }}-${{ github.run_attempt }}

  host-linux-arm64:
    name: Linux host build (glibc-arm64)
    needs: preflight
    if: needs.preflight.outputs.linux == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build and compiler cache roots
        run: |
          echo "UBQ_BUILD_ROOT=$RUNNER_WORKSPACE/build-arm64" >> "$GITHUB_ENV"
          echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-arm64.log" >> "$GITHUB_ENV"
      - name: Free unused hosted SDK space
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
          df -h /
      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ runner.workspace }}/ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-gcc-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-v2-${{ runner.os }}-${{ runner.arch }}-gcc-
      - name: Name the CI image
        id: image
        run: echo "digest=$(./Scripts/ci-linux-image.sh --recipe-digest)" >> "$GITHUB_OUTPUT"
      - name: Restore the CI image
        id: restore-image
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ runner.temp }}/ubq-ci-linux-image.tar
          key: ci-linux-image-${{ runner.arch }}-${{ steps.image.outputs.digest }}
      - name: Build and test native ARM64
        env:
          UBQ_CI_LINUX_IMAGE: "true"
          UBQ_CI_IMAGE_ARCHIVE: ${{ runner.temp }}/ubq-ci-linux-image.tar
          CC: gcc
          CXX: g++
        run: |
          ./Scripts/ci-linux-image.sh bash -euc '
              test "$(uname -m)" = aarch64
              ./Scripts/build-host.sh --release'
      - name: Compiler cache hit rate
        if: always()
        env:
          UBQ_CI_LINUX_IMAGE: "true"
        run: ./Scripts/ci-linux-image.sh bash -c 'if [ -s "$CCACHE_STATSLOG" ]; then ccache --show-log-stats; else echo "No compiler invocations recorded in this job"; fi'
      - name: Print failed build diagnostics
        if: failure()
        run: |
          find "$UBQ_BUILD_ROOT" -name build.log -type f -exec tail -n 100 {} ";"
      - name: Save the CI image
        if: always() && steps.restore-image.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ runner.temp }}/ubq-ci-linux-image.tar
          key: ci-linux-image-${{ runner.arch }}-${{ steps.image.outputs.digest }}
      - name: Save the compiler cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ runner.workspace }}/ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-gcc-${{ github.run_id }}-${{ github.run_attempt }}

  coverage:
    name: Coverage floor
    needs: preflight
    if: needs.preflight.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # The exact-head preflight already runs the gate self-tests. They do
      # not execute the instrumented terminal and add no line coverage.
      UBQ_CI_PREFLIGHT_COMPLETE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build and compiler cache roots
        run: |
          echo "UBQ_BUILD_ROOT=$RUNNER_WORKSPACE/build-coverage" >> "$GITHUB_ENV"
          echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-coverage.log" >> "$GITHUB_ENV"
      - name: Free unused hosted SDK space
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
          df -h /
      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ runner.workspace }}/ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-v2-${{ runner.os }}-${{ runner.arch }}-coverage-
      - name: Name the CI image
        id: image
        run: echo "digest=$(./Scripts/ci-linux-image.sh --recipe-digest)" >> "$GITHUB_OUTPUT"
      - name: Restore the CI image
        id: restore-image
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ runner.temp }}/ubq-ci-linux-image.tar
          key: ci-linux-image-${{ runner.arch }}-${{ steps.image.outputs.digest }}
      - name: Instrumented suite and owned coverage floors
        env:
          UBQ_CI_LINUX_IMAGE: "true"
          UBQ_CI_IMAGE_ARCHIVE: ${{ runner.temp }}/ubq-ci-linux-image.tar
          CC: clang
          CXX: clang++
        run: |
          ./Scripts/ci-linux-image.sh bash -euc '
              export PATH="$UBQ_PGO_LLVM:$PATH"
              ./Scripts/install-hooks.sh
              ./Scripts/ensure-quic-deps.sh
              ./Scripts/run-coverage.sh --check-file-floors'
      - name: Compiler cache hit rate
        if: always()
        env:
          UBQ_CI_LINUX_IMAGE: "true"
        run: ./Scripts/ci-linux-image.sh bash -c 'if [ -s "$CCACHE_STATSLOG" ]; then ccache --show-log-stats; else echo "No compiler invocations recorded in this job"; fi'
      - name: Print failed build diagnostics
        if: failure()
        run: |
          find "$UBQ_BUILD_ROOT" -name build.log -type f -exec tail -n 100 {} ";"
      - name: Save the CI image
        if: always() && steps.restore-image.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ runner.temp }}/ubq-ci-linux-image.tar
          key: ci-linux-image-${{ runner.arch }}-${{ steps.image.outputs.digest }}
      - name: Save the compiler cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ runner.workspace }}/ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-coverage-${{ github.run_id }}-${{ github.run_attempt }}

  ci:
    name: CI
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs: [preflight, linux, apple, host-linux-arm64, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job that had to run passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          failed = []
          for job, result in sorted(needs.items()):
              conclusion = result["result"]
              print(f"{job}: {conclusion}")
              if job == "preflight" and conclusion != "success":
                  failed.append(job)
              elif conclusion not in ("success", "skipped"):
                  failed.append(job)
          if failed:
              print(f"::error title=CI::did not pass: {', '.join(failed)}")
              sys.exit(1)
          EOF
